<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bluesky Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto flex min-h-screen max-w-lg items-center justify-center p-6">
    <section class="w-full rounded-2xl border border-slate-800 bg-slate-900/90 p-6 shadow-2xl">
      <h1 class="text-xl font-semibold">Finishing Bluesky login</h1>
      <p id="status" class="mt-3 text-sm text-slate-300">Completing OAuth…</p>
    </section>
  </main>

  <script src="../client.js"></script>
  <script>
    const statusEl = document.getElementById("status");

    if (!oauth.redirectLocalhost()) {
      oauth.callback()
        .then(session => {
          statusEl.textContent = `Login complete for ${session.did}. Returning to the app…`;
          location.replace(session.appUrl || "/");
        })
        .catch(error => {
          console.error(error);
          statusEl.textContent = error.message || "Login failed.";
        });
    }
  </script>
</body>

</html>
